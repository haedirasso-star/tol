name: totv_voice_rooms
description: TOTV+ Voice Rooms — غرف صوتية منخفضة الاستهلاك عبر LiveKit
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ───────────────────────────────────────────────
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  cloud_functions: ^5.1.3

  # ── الصوت الحيّ ────────────────────────────────────────────
  livekit_client: ^2.4.0
  permission_handler: ^11.3.1

  # ── إدارة الحالة ───────────────────────────────────────────
  flutter_bloc: ^8.1.6

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true
